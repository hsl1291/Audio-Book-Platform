# XcodeGen spec.
#
#   brew install xcodegen
#   xcodegen generate
#   open Backlist.xcodeproj
#
# Generated rather than committed because a .xcodeproj is a large, merge-hostile
# file that gains nothing from version control when the inputs are this simple.
# Regenerate after adding files; nothing here needs editing for day-to-day work.

name: Backlist
options:
  bundleIdPrefix: com.backlist
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  BacklistCore:
    path: .

targets:
  Backlist:
    type: application
    platform: iOS
    # Generates a shared scheme, so command-line builds do not depend on Xcode
    # having auto-created one in a GUI session.
    scheme: {}
    sources:
      - path: App/Backlist
    dependencies:
      - package: BacklistCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.backlist.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Backlist/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Backlist/Resources/Backlist.entitlements
        # Swift 6 language mode: data races are compile errors. The app was first
        # brought to zero diagnostics under Swift 5 with complete checking, then
        # switched, so this never mixed concurrency errors with ordinary ones.
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Set this to your own team before the first device build. Without it the
        # app runs in the simulator but will not install on a phone.
        DEVELOPMENT_TEAM: ""
